<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Jot</title>
  </head>
  <body>
    <header class="bar">
      <button class="icon" id="menu" data-icon="menu" aria-label="All notes"></button>
      <button class="title" id="title" aria-label="Rename, move or delete note">
        <span class="folder" id="folder"></span><span id="name"></span>
      </button>
      <div class="inktools" id="inktools" hidden>
        <span id="swatches"></span>
        <button class="icon" id="eraser" data-icon="eraser" aria-label="Eraser"></button>
        <button class="icon" id="undo" data-icon="undo" aria-label="Undo"></button>
        <button class="icon" id="redo" data-icon="redo" aria-label="Redo"></button>
      </div>
      <button class="status" id="status" aria-label="Sync status"></button>
      <button class="icon" id="new-ink" data-icon="pen" aria-label="New handwritten note"></button>
      <button class="icon" id="new-text" data-icon="text" aria-label="New text note"></button>
    </header>

    <main id="editor"></main>

    <div class="scrim" id="scrim" hidden></div>
    <nav class="drawer" id="drawer" aria-label="Notes">
      <div class="folders" id="folders"></div>
      <footer>
        <span class="sync-text" id="sync-text"></span>
        <button class="icon" id="new-folder" data-icon="folder" aria-label="New folder"></button>
        <button class="icon" id="open-settings" data-icon="settings" aria-label="Settings"></button>
      </footer>
    </nav>

    <dialog id="note-dialog">
      <form method="dialog">
        <label>Name <input id="note-name" required autocomplete="off" /></label>
        <label>Folder <select id="note-folder"></select></label>
        <menu>
          <button class="btn danger" id="note-delete" type="button">Delete</button>
          <span class="spacer"></span>
          <button class="btn" id="note-cancel" type="button">Cancel</button>
          <button class="btn primary" value="save">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2>Settings</h2>
        <p class="hint">
          Notes sync to a private GitHub repository. Create a
          <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
          with access to only that repository and <b>Contents: Read and write</b> permission.
        </p>
        <label>Repository <input id="s-repo" placeholder="username/notes" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
        <label>Branch <input id="s-branch" placeholder="main" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
        <label>Token <input id="s-token" type="password" autocomplete="off" /></label>
        <label>
          New notes start as
          <select id="s-capture">
            <option value="ink">Handwriting</option>
            <option value="text">Text</option>
          </select>
        </label>
        <p class="hint" id="s-msg" role="status"></p>
        <menu>
          <span class="spacer"></span>
          <button class="btn" id="s-cancel" type="button">Cancel</button>
          <button class="btn primary" value="save">Save</button>
        </menu>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
